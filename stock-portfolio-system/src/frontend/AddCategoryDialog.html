<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; font-size: 14px; padding: 16px; margin: 0; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; color: #333; }
    input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    input:focus, textarea:focus { outline: none; border-color: #4285f4; }
    .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .btn-primary { background: #4285f4; color: white; }
    .btn-secondary { background: #f1f1f1; color: #333; }
    .btn-primary:hover { background: #3367d6; }
    .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
    .loading { text-align: center; padding: 20px; color: #666; }
  </style>
</head>
<body>
  <form id="addCategoryForm">
    <div class="form-group">
      <label for="name">Category Name *</label>
      <input type="text" id="name" name="name" required placeholder="e.g., Large Cap">
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description" rows="3"
                placeholder="e.g., Blue-chip companies with market cap > 20,000 Cr"></textarea>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" onclick="google.script.host.close()">Cancel</button>
      <button type="submit" class="btn btn-primary">Add Category</button>
    </div>
  </form>

  <div id="loadingIndicator" class="loading" style="display: none;">
    Processing...
  </div>

  <script>
    document.getElementById('addCategoryForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const formData = {
        name: document.getElementById('name').value,
        description: document.getElementById('description').value
      };

      document.getElementById('addCategoryForm').style.display = 'none';
      document.getElementById('loadingIndicator').style.display = 'block';

      google.script.run
        .withSuccessHandler(handleResult)
        .withFailureHandler(handleError)
        .handleAddCategory(formData);
    });

    function handleResult(result) {
      if (result.success) {
        alert('Category added: ' + result.name);
        google.script.host.close();
      } else {
        handleError(result.error);
      }
    }

    function handleError(error) {
      document.getElementById('addCategoryForm').style.display = 'block';
      document.getElementById('loadingIndicator').style.display = 'none';
      alert('Error: ' + error);
    }
  </script>
</body>
</html>
